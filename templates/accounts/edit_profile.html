{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card shadow-sm"><div class="card-body">
    <h4 class="mb-3">Edit Profile</h4>
    <form method="POST">{% csrf_token %}
        {% for field in form %}
            <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}
            {% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}</div>
        {% endfor %}
        <button type="submit" class="btn btn-success">Save</button>
        <a href="{% url 'profile' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div></div></div></div>
{% endblock %}
